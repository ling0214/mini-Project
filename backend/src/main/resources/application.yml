server:
  port: 8080

# Persistent debug logging: written to backend/logs/backend.log (relative to
# the working directory `mvn spring-boot:run` is started from — backend/) in
# addition to the console, with a rolling policy so it doesn't grow unbounded.
# Before this, debugging relied on ad-hoc `nohup ... > backend-run.N.log`
# redirects that got overwritten/lost across restarts.
logging:
  file:
    name: logs/backend.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 10
      total-size-cap: 100MB
  level:
    root: INFO
    com.miniproject.backend: DEBUG

spring:
  application:
    name: mini-project-backend
  # backend/src/main/resources/application-local.yml is gitignored
  # (**/application-local.yml) — put secrets there, e.g.:
  #   anthropic:
  #     api-key: sk-ant-...
  # "optional:" means nothing breaks if the file doesn't exist yet.
  config:
    import: optional:classpath:application-local.yml
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    # Local MySQL instance (DBeaver-managed). Override any of these via env
    # vars for another machine/environment; password defaults empty to match
    # this dev root account -- put a real one in application-local.yml or
    # DB_PASSWORD if the target server ever needs auth.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:miniproject}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

mcp:
  # Relative to the backend module's working directory (default when running
  # `mvn spring-boot:run` from backend/). Override with an absolute path if
  # you run the jar from elsewhere.
  python-executable: ../mcp-server/.venv/Scripts/python.exe
  server-args: -m,mcp_server.server

analysis:
  requirement:
    # rule-based keeps the demo deterministic. Set to "llm" to route
    # RequirementAnalysisSkill through LlmRequirementAnalysisSynthesizer.
    provider: ${ANALYSIS_REQUIREMENT_PROVIDER:rule-based}
  codeqa:
    # rule-based (default) only formats graph/issue facts into a template
    # answer — see RuleBasedAnswerSynthesizer. Set to "llm" to route
    # CodeQaSkill through LlmAnswerSynthesizer, which reasons over the same
    # facts via whichever analysis.llm.provider is active below.
    provider: ${ANALYSIS_CODEQA_PROVIDER:rule-based}
  hermes-version:
    # Rule-based default falls back to "N feat: commits found upstream but not
    # evaluated" without reasoning. Set to "llm" to route HermesVersionAdvisorSkill
    # through LlmHermesVersionAdvisorSynthesizer, which analyzes git facts
    # (commits behind, touched watched files, feature subjects) and recommends
    # a specific upstream ref with reasoning + risks + suggested enhancements.
    # Requires analysis.llm.provider to be set (e.g., "claude-cli").
    provider: ${ANALYSIS_HERMES_VERSION_PROVIDER:llm}
  llm:
    # rule-based/noop by default. Set to "openai" together with OPENAI_API_KEY
    # for cloud-backed analysis, "local" (see local-llm.* below) to keep text
    # on a self-hosted model for AI-restricted networks, or "claude-cli" (see
    # claude-cli.* below) to shell out to an already-logged-in local Claude
    # Code CLI instead of managing a separate API key at all. Default is
    # "claude-cli" if available (no extra key management), else "rule-based".
    provider: ${ANALYSIS_LLM_PROVIDER:claude-cli}
  target-project:
    # Current demo target. Override these when testing another project.
    name: ${ANALYSIS_TARGET_PROJECT_NAME:MyBanjirCare}
    path: ${ANALYSIS_TARGET_PROJECT_PATH:C:/tmp/MyBanjirCare}
  graphify:
    # Used by Project Overview -> Run Graphify index. Override if graphify is
    # installed outside PATH, e.g. C:/Users/.../Scripts/graphify.exe.
    command: ${GRAPHIFY_COMMAND:graphify}

anthropic:
  # Not read by any code yet — no LLM-based synthesizer is wired up (see
  # docs/proposal.md Section 5.7/Chapter 15). This just reserves the
  # property name/shape. Put the real key in application-local.yml
  # (gitignored) or the ANTHROPIC_API_KEY env var — never as a default
  # here, this file is tracked by git. Empty means "no key configured."
  api-key: ${ANTHROPIC_API_KEY:}

openai:
  # Same rule: real key goes in application-local.yml or OPENAI_API_KEY,
  # never hardcoded here.
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-5-mini}

local-llm:
  # No API key here by design: this targets a self-hosted OpenAI-compatible
  # /v1/chat/completions server (Ollama, LM Studio, vLLM, llama.cpp server)
  # on the same machine or private network — for teams whose AI policy won't
  # allow requirement text to leave the network at all. Set
  # analysis.llm.provider=local to activate.
  base-url: ${LOCAL_LLM_BASE_URL:http://localhost:11434}
  model: ${LOCAL_LLM_MODEL:llama3.1}
  timeout-seconds: ${LOCAL_LLM_TIMEOUT_SECONDS:120}

claude-cli:
  # No API key here either — this shells out to the `claude` executable
  # already installed and logged in on this machine (ClaudeCliAnalysisClient),
  # same trust model as analysis.graphify.command above. Set
  # analysis.llm.provider=claude-cli to activate.
  command: ${CLAUDE_CLI_COMMAND:claude}
  timeout-seconds: ${CLAUDE_CLI_TIMEOUT_SECONDS:120}

integrations:
  jira:
    # Disabled by default. Put real values in application-local.yml or env vars.
    enabled: ${JIRA_ENABLED:false}
    base-url: ${JIRA_BASE_URL:}
    email: ${JIRA_EMAIL:}
    api-token: ${JIRA_API_TOKEN:}
    project-key: ${JIRA_PROJECT_KEY:}
    issue-type: ${JIRA_ISSUE_TYPE:Task}
    acceptance-criteria-field: ${JIRA_ACCEPTANCE_CRITERIA_FIELD:}
    # basic = classic Jira API token against https://<site>.atlassian.net
    # scoped = scoped Jira API token against https://api.atlassian.com/ex/jira/{cloud-id}
    auth-mode: ${JIRA_AUTH_MODE:basic}
    cloud-id: ${JIRA_CLOUD_ID:}

  bitbucket:
    # Bitbucket Cloud PR comment connector, disabled by default.
    enabled: ${BITBUCKET_ENABLED:false}
    api-base-url: ${BITBUCKET_API_BASE_URL:https://api.bitbucket.org/2.0}
    username: ${BITBUCKET_USERNAME:}
    app-password: ${BITBUCKET_APP_PASSWORD:}

  hermes:
    # Sends reviewed analyst packages into the existing Hermes intake channel.
    # Put the real webhook in application-local.yml or HERMES_DISCORD_WEBHOOK_URL.
    enabled: ${HERMES_ENABLED:false}
    discord-webhook-url: ${HERMES_DISCORD_WEBHOOK_URL:}
    target-label: ${HERMES_TARGET_LABEL:Hermes Discord intake}
    # There is exactly one Hermes upstream (github.com/NousResearch/hermes-agent),
    # so Hermes Version Control locks onto this single local clone instead of
    # asking the analyst to type/remember a repo path every time (see the
    # missing-"Local\"-segment typo that caused an HTTP 500 before this).
    agent-repo-path: ${HERMES_AGENT_REPO_PATH:C:/Users/lingn/AppData/Local/hermes/hermes-agent}

  google:
    # OAuth 2.0, covers Calendar (read-only) + Gmail (read-only) with one
    # connection — a Meet event's join link lives on the Calendar event
    # itself, there's no separate personal "list my Meet meetings" API.
    # Disabled by default. Put real client-id/client-secret in
    # application-local.yml (never here — this file is tracked by git).
    enabled: ${GOOGLE_ENABLED:false}
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    # Must exactly match an "Authorized redirect URI" on the Google Cloud
    # OAuth client (Web application type).
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/integrations/google/callback}
    scopes: ${GOOGLE_SCOPES:https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/gmail.readonly}
    # Where the backend sends the browser after a successful connect — the
    # running Vite dev server, not an API endpoint.
    frontend-redirect: ${GOOGLE_FRONTEND_REDIRECT:http://127.0.0.1:5173/}
